<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>avec · Calculadora de propostas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --roxo:#5B4FE9;
  --roxo-claro:#746EF6;
  --roxo-escuro:#3F35B8;
  --roxo-leve:#ECEAFE;
  --tinta:#1C1B2E;
  --tinta-suave:#6B6A80;
  --linha:#E4E3ED;
  --cinza:#F3F3F8;
  --ok:#1E9E6A;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#FFFFFF;color:var(--tinta);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}

/* ---------- topo (permanece branco) ---------- */
.topo{
  background:#fff;border-bottom:1px solid var(--linha);
  padding:18px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  position:sticky;top:0;z-index:40;
}
.topo img{height:30px;width:auto;display:block}
.topo .sep{width:1px;height:26px;background:var(--linha)}
.topo p{margin:0;color:var(--tinta-suave);font-size:14px}
.topo .dir{margin-left:auto;display:flex;gap:10px}

/* ---------- layout ---------- */
.tela{max-width:1280px;margin:0 auto;padding:26px 24px 90px;display:grid;grid-template-columns:1fr 410px;gap:26px;align-items:start}
@media(max-width:1040px){.tela{grid-template-columns:1fr}}

.bloco{background:var(--cinza);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}
.bloco > header{padding:16px 20px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px}
.bloco > header h2{font-size:16px}
.bloco > header .contador{margin-left:auto;font-size:13px;color:var(--tinta-suave)}
.corpo{padding:20px}
.bloco + .bloco{margin-top:22px}

/* ---------- contexto ---------- */
.contexto{display:grid;grid-template-columns:1fr auto;gap:16px;padding:18px 20px;border-bottom:1px solid var(--linha);align-items:end}
@media(max-width:620px){.contexto{grid-template-columns:1fr}}
.ciclo{display:flex;background:#fff;border:1px solid var(--linha);border-radius:11px;padding:3px;gap:3px}
.ciclo button{border:none;background:none;padding:8px 16px;border-radius:8px;cursor:pointer;color:var(--tinta-suave);font-size:14px}
.ciclo button[aria-pressed="true"]{background:var(--roxo);color:#fff}

/* ---------- busca e abas ---------- */
.nota{margin:0;padding:12px 20px 0;font-size:12.6px;color:var(--roxo-escuro)}
.desc.faixa{color:var(--roxo-escuro)}
.busca{padding:14px 20px;border-bottom:1px solid var(--linha)}
.busca input{width:100%;padding:10px 14px;border:1px solid var(--linha);border-radius:10px;background:#fff}
.busca input:focus{outline:2px solid var(--roxo);outline-offset:1px}
.abas{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid var(--linha)}
.aba{padding:7px 14px;border:1px solid var(--linha);background:#fff;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--tinta-suave)}
.aba:hover{border-color:var(--roxo)}
.aba[aria-pressed="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}

/* ---------- lista de produtos ---------- */
.grupo{padding:18px 20px 6px;font-size:12.5px;color:var(--tinta-suave);font-weight:500}
.item{display:flex;align-items:center;gap:16px;padding:13px 20px;border-top:1px solid var(--linha);cursor:pointer;background:transparent}
.item:hover{background:#fff}
.item .txt{flex:1;min-width:0}
.item .nome{font-weight:500}
.item .desc{font-size:12.8px;color:var(--tinta-suave)}
.item .val{text-align:right;white-space:nowrap}
.item .val b{font-weight:600}
.item .val s{color:var(--tinta-suave);font-weight:400;font-size:12.5px;margin-right:6px}
.item .val small{display:block;font-size:12px;color:var(--tinta-suave);font-weight:400}
.mais{border:1px solid var(--linha);background:#fff;color:var(--roxo);width:34px;height:34px;border-radius:10px;font-size:19px;line-height:1;cursor:pointer;flex:none}
.item.dentro{background:#fff;box-shadow:inset 3px 0 0 var(--roxo)}
.item.dentro .mais{background:var(--roxo);border-color:var(--roxo);color:#fff}

/* ---------- carrinho ---------- */
.painel{position:sticky;top:96px}
.vazio{padding:34px 20px;text-align:center;color:var(--tinta-suave);font-size:14px;margin:0}
.linha{padding:14px 20px;border-bottom:1px solid var(--linha)}
.linha .cab{display:flex;gap:10px;align-items:flex-start}
.linha .cab strong{font-weight:500;flex:1;font-size:14.5px}
.tirar{border:none;background:none;color:var(--tinta-suave);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.tirar:hover{color:#D14343}
.controles{display:flex;gap:8px;margin-top:10px;align-items:center}
.controles label{font-size:12px;color:var(--tinta-suave);display:flex;flex-direction:column;gap:3px}
.controles input{padding:7px 9px;border:1px solid var(--linha);border-radius:9px;background:#fff}
.controles .qtd{width:78px}
.controles .preco{width:118px}
.controles .total{margin-left:auto;text-align:right;font-weight:600;padding-top:14px;white-space:nowrap}
.controles .total small{display:block;font-size:11px;color:var(--tinta-suave);font-weight:400}

.somas{padding:18px 20px;background:#fff;border-top:1px solid var(--linha)}
.soma{display:flex;justify-content:space-between;padding:5px 0;font-size:14.5px;gap:14px}
.soma span:first-child{color:var(--tinta-suave)}
.soma.forte{font-size:17px;font-weight:600;border-top:1px solid var(--linha);margin-top:10px;padding-top:12px}
.soma.forte span:first-child{color:var(--tinta)}
.desc-linha{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--linha);font-size:14px}
.desc-linha input{width:78px;padding:7px 9px;border:1px solid var(--linha);border-radius:9px;background:#fff;text-align:right}
.desc-linha select{padding:7px 6px;border:1px solid var(--linha);border-radius:9px;background:#fff}
.aviso{font-size:12.5px;color:#B4571E;padding:0 20px 14px}
.desc-linha .marca{flex:1;font-size:12.6px;color:var(--tinta-suave)}
.opcoes{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.op{border:1px solid var(--linha);background:#fff;border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;color:var(--tinta-suave)}
.op:hover{border-color:var(--roxo)}
.op[aria-pressed="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}
.salva{display:flex;gap:12px;align-items:center;padding:13px 20px;border-top:1px solid var(--linha);cursor:pointer}
.salva:first-child{border-top:none}
.salva:hover{background:#fff}
.salva.atual{background:#fff;box-shadow:inset 3px 0 0 var(--roxo)}
.salva .txt{flex:1;min-width:0}
.salva .nome{font-weight:500}
.salva .desc{font-size:12.6px;color:var(--tinta-suave)}
.linha-log{padding:8px 0;border-bottom:1px solid var(--linha);font-size:13px}
.linha-log span{color:var(--tinta-suave);margin-right:10px}
.sombra-log{display:none}
body.vendo-log .sombra-log{display:block}
@media print{.sombra-log{display:none!important}}
.mini{border:1px solid var(--linha);background:#fff;border-radius:9px;padding:6px 10px;font-size:12.6px;cursor:pointer;color:var(--tinta-suave)}
.mini:hover{border-color:var(--roxo);color:var(--roxo-escuro)}
.flag{display:flex;align-items:center;gap:7px;font-size:12.6px;color:var(--tinta-suave);cursor:pointer;margin-top:9px}
.flag input{width:16px;height:16px;accent-color:var(--roxo);cursor:pointer}
.flag.on{color:var(--roxo-escuro)}
.linha.comdesc{background:#fff;box-shadow:inset 3px 0 0 var(--roxo-claro)}

/* ---------- formulário ---------- */
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campos .largo{grid-column:1/-1}
.campo{display:flex;flex-direction:column;gap:5px}
.campo span{font-size:12.5px;color:var(--tinta-suave)}
.campo input,.campo textarea,.campo select{padding:9px 12px;border:1px solid var(--linha);border-radius:10px;background:#fff}
.campo textarea{resize:vertical;min-height:76px}
.campo input:focus,.campo textarea:focus,.campo select:focus{outline:2px solid var(--roxo);outline-offset:1px}

/* ---------- botões ---------- */
.btn{border:1px solid var(--linha);background:#fff;padding:11px 18px;border-radius:11px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--roxo);color:var(--roxo-escuro)}
.btn.cheio{background:var(--roxo);border-color:var(--roxo);color:#fff}
.btn.cheio:hover{background:var(--roxo-escuro);border-color:var(--roxo-escuro);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acoes{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--linha)}
.acoes .btn{flex:1}

/* ---------- pré-visualização ---------- */
.sombra{position:fixed;inset:0;background:rgba(28,27,46,.55);z-index:60;overflow:auto;padding:26px 16px;display:none}
body.vendo .sombra{display:block}
.moldura{max-width:830px;margin:0 auto}
.barra{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px}

/* ---------- documento ---------- */
.doc{background:#fff;padding:52px 56px;font-size:13.4px;line-height:1.55}
.doc-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;padding-bottom:22px;border-bottom:2px solid var(--roxo)}
.doc-topo img{height:34px}
.doc-topo .meta{text-align:right;font-size:12.4px;color:var(--tinta-suave)}
.doc h1{font-size:25px;margin:30px 0 4px}
.doc .sub{color:var(--tinta-suave);margin:0 0 24px}
.doc h3{font-size:12.4px;color:var(--roxo-escuro);margin:24px 0 8px;font-weight:600}
.para{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;background:var(--roxo-leve);padding:16px 18px;border-radius:10px}
.para div span{color:var(--tinta-suave);font-size:11.8px;display:block}
table.itens{width:100%;border-collapse:collapse}
table.itens th{text-align:left;font-size:11.4px;color:var(--tinta-suave);font-weight:500;padding:0 8px 7px;border-bottom:1px solid var(--linha)}
table.itens td{padding:9px 8px;border-bottom:1px solid var(--linha);vertical-align:top}
table.itens th.n,table.itens td.n{text-align:right;white-space:nowrap}
table.itens td .d{font-size:11.8px;color:var(--tinta-suave)}
table.itens td s{color:var(--tinta-suave);font-size:11.8px;display:block}
.fecho{margin-top:24px;background:var(--tinta);color:#fff;border-radius:12px;padding:20px 24px}
.fecho .l{display:flex;justify-content:space-between;padding:4px 0;font-size:13.4px;color:#C9C8DA;gap:16px}
.fecho .l.big{font-size:19px;font-weight:600;color:#fff;border-top:1px solid rgba(255,255,255,.18);margin-top:10px;padding-top:12px}
.obs{white-space:pre-wrap;color:var(--tinta-suave)}
.dados{margin-top:12px;border:1px solid var(--linha);border-radius:10px;padding:14px 16px}
.dados + .dados{margin-top:10px}
.dados-tit{font-weight:600;font-size:12.8px;margin-bottom:10px}
.dados-grade{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.dado span{font-size:11.6px;color:var(--tinta-suave);display:block}
.dado{border-bottom:1px solid var(--linha);padding-bottom:14px}
.rodape{margin-top:32px;padding-top:16px;border-top:1px solid var(--linha);font-size:11.4px;color:var(--tinta-suave);display:flex;justify-content:space-between;gap:20px}

/* ---------- impressão ---------- */
@media print{
  @page{size:A4;margin:13mm}
  body{background:#fff}
  .topo,.tela,.barra{display:none!important}
  .sombra{display:block!important;position:static;background:none;padding:0;overflow:visible}
  .moldura{max-width:none}
  .doc{padding:0;font-size:11pt}
  .fecho,.para{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{page-break-inside:avoid}
}
</style>
</head>

<div class="tela">

  <section>
    <div class="bloco">
      <header><h2>Catálogo</h2><span class="contador" id="cont"></span></header>

        <label class="campo">
          <span>Porte do cliente — define o preço da plataforma e da IA</span>
          <select id="porte" onchange="mudaPorte()"></select>
        </label>
        <div>
          <div class="ciclo" id="ciclo">

          </div>
        </div>
      </div>

      <p class="nota" id="notaPorte"></p>
      <div class="busca"><input id="busca" type="search" placeholder="Buscar produto pelo nome…" oninput="desenhaCatalogo()"></div>
      <div class="abas" id="abas"></div>
      <div id="catalogo"></div>
    </div>
  </section>

  <aside class="painel">
    <section class="bloco">
      <header><h2>Proposta</h2><span class="contador" id="qtdItens"></span></header>
      <div id="carrinho"><p class="vazio">Escolha os produtos ao lado para montar o orçamento.</p></div>

      <div class="desc-linha">
        <span>Desconto</span>
        <div class="opcoes" id="opcoesDesc"></div>
      </div>
      <div class="desc-linha">
        <span class="marca" id="marcados"></span>
        <button class="mini" onclick="marcarTodos(true)">Todos</button>
        <button class="mini" onclick="marcarTodos(false)">Nenhum</button>
      </div>

      <div class="somas" id="somas"></div>

      <div class="corpo" style="border-top:1px solid var(--linha)">
        <div class="campos">
          <label class="campo largo"><span>Cliente</span><input id="cliNome" placeholder="Nome do estabelecimento"></label>
          <label class="campo"><span>Contato</span><input id="cliContato" placeholder="Pessoa responsável"></label>
          <label class="campo"><span>E-mail ou telefone</span><input id="cliEmail"></label>
          <label class="campo"><span>Consultor</span><input id="propVend"></label>
          <label class="campo"><span>Proposta nº</span><input id="propNum"></label>
          <label class="campo"><span>Validade</span>
            <select id="propDias" onchange="mudaValidade()">
              <option value="5">5 dias</option>
              <option value="7">7 dias</option>
              <option value="10">10 dias</option>
              <option value="15" selected>15 dias</option>
              <option value="20">20 dias</option>
              <option value="30">30 dias</option>
              <option value="45">45 dias</option>
              <option value="60">60 dias</option>
            </select></label>
          <label class="campo"><span>Válida até</span><input id="propVal" type="date"></label>
          <label class="campo"><span>Forma de pagamento</span>
            <select id="propPgto"></select></label>
          <label class="campo largo"><span>Observações</span><textarea id="propObs" placeholder="Ex.: primeiro onboarding gratuito, migração isenta…"></textarea></label>
        </div>
      </div>

      <div class="acoes">
        <button class="btn" onclick="salvarProposta()">Salvar</button>
        <button class="btn cheio" id="btnVer" onclick="abrePreview()" disabled>Ver proposta</button>
      </div>
    </section>

    <section class="bloco">

let carrinho = [];
let grupoAtivo = "Todos";
let porte = "ate2";
let ciclo = "mensal";
let descPct = 0;                       // desconto vigente, em %
const DESCONTOS = [0, 5, 10, 15, 20];  // opções liberadas pela política comercial

const dinheiro = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const nomePorte = () => (PORTES.find(p=>p.id===porte)||{}).nome || "";
const porFaixa  = p => !!p.porPorte;                       // produto que varia por faixa
const nomeItem  = p => p.nome + (porFaixa(p) ? " · " + nomePorte() : "");

/* preço de tabela do item no porte e ciclo atuais */
function precoTabela(p){
  if(p.tipo==='unico') return p.preco ?? 0;
  if(ciclo==='anual'){
    if(p.anualPorte) return p.anualPorte[porte] ?? 0;
    if(p.anual!=null) return p.anual;
  }
  if(p.porPorte) return p.porPorte[porte] ?? 0;
  return p.preco ?? 0;
}
function precoDe(p){
  if(p.dePorte) return p.dePorte[porte] ?? null;
  return p.de ?? null;
}
function disponivel(p){ return !p.somentePorte || p.somentePorte.includes(porte); }

/* ---- contexto ---- */
function montaPortes(){
  $('porte').innerHTML = PORTES.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('');
  $('porte').value = porte;
}
function mudaPorte(){
  porte = $('porte').value;
  carrinho = carrinho.filter(c=>disponivel(CATALOGO[c.i]));
  carrinho.forEach(c=>{ if(!c.custom) c.preco = precoTabela(CATALOGO[c.i]); });
  atualiza();
}
function montaPagamentos(){
  const atual = $('propPgto').value;
  $('propPgto').innerHTML = PAGAMENTOS[ciclo].map(p=>`<option>${esc(p)}</option>`).join('');
  if(PAGAMENTOS[ciclo].includes(atual)) $('propPgto').value = atual;
}
function ciclosUI(){
  [...$('ciclo').children].forEach(b=>b.setAttribute('aria-pressed', b.textContent.toLowerCase().startsWith(ciclo==='mensal'?'mensal':'anual')));
}
function mudaCiclo(v){
  ciclo = v;
  montaPagamentos();
  ciclosUI();
  carrinho.forEach(c=>{ if(!c.custom) c.preco = precoTabela(CATALOGO[c.i]); });
  atualiza();
}

/* ---- catálogo ---- */
function desenhaAbas(){
  const grupos = ["Todos", ...new Set(CATALOGO.map(p=>p.grupo))];
  $('abas').innerHTML = grupos.map(g=>
    `<button class="aba" aria-pressed="${g===grupoAtivo}" onclick="grupoAtivo=this.dataset.g;desenhaAbas();desenhaCatalogo()" data-g="${esc(g)}">${esc(g)}</button>`).join('');
}
function desenhaCatalogo(){
  const termo = $('busca').value.trim().toLowerCase();
  const lista = CATALOGO.map((p,i)=>({...p,i}))
    .filter(p => disponivel(p)
              && (grupoAtivo==="Todos"||p.grupo===grupoAtivo)
              && (p.nome+' '+(p.desc||'')).toLowerCase().includes(termo));

  $('cont').textContent = lista.length + (lista.length===1?" produto":" produtos");
  $('notaPorte').textContent = "Plataforma e Avec IA estão com o preço de " + nomePorte().toLowerCase() + ".";
  if(!lista.length){ $('catalogo').innerHTML = `<p class="vazio">Nenhum produto com esse nome. Ajuste a busca ou troque de categoria.</p>`; return; }

  let html='', ultimo=null;
  lista.forEach(p=>{
    if(p.grupo!==ultimo && grupoAtivo==="Todos"){ html+=`<p class="grupo">${esc(p.grupo)}</p>`; ultimo=p.grupo; }
    const dentro = carrinho.some(c=>c.i===p.i);
    const v = precoTabela(p), cheio = precoDe(p);
    html += `<div class="item ${dentro?'dentro':''}" onclick="alterna(${p.i})">
      <div class="txt"><div class="nome">${esc(nomeItem(p))}</div>${p.desc?`<div class="desc">${esc(p.desc)}</div>`:''}${porFaixa(p)?`<div class="desc faixa">Plano de ${esc(nomePorte().toLowerCase())}</div>`:''}</div>
      <div class="val">
        ${cheio&&cheio>v?`<s>${dinheiro(cheio)}</s>`:''}<b>${v?dinheiro(v):'a combinar'}</b>
        <small>por ${esc(p.unidade||'un')}${p.tipo==='mensal'?(ciclo==='anual'?' · plano anual':' · parcelado'):' · uma vez'}</small>
      </div>
      <button class="mais">${dentro?'✓':'+'}</button></div>`;
  });
  $('catalogo').innerHTML = html;
}

/* ---- carrinho ---- */
function alterna(i){
  const pos = carrinho.findIndex(c=>c.i===i);
  if(pos>-1) carrinho.splice(pos,1);
  else carrinho.push({ i, qtd:1, preco:precoTabela(CATALOGO[i]), custom:false, desc:true });
  atualiza();
}
function tira(i){ carrinho = carrinho.filter(c=>c.i!==i); atualiza(); }
function mudaQtd(i,v){ const c=carrinho.find(c=>c.i===i); c.qtd = Math.max(1, parseFloat(v)||1); atualiza(); }
function mudaPreco(i,v){ const c=carrinho.find(c=>c.i===i); c.preco = Math.max(0, parseFloat(v)||0); c.custom = true; atualiza(); }

function taxaDesconto(){ return descPct/100; }
function montaDescontos(){
  $('opcoesDesc').innerHTML = DESCONTOS.map(d=>
    `<button class="op" aria-pressed="${d===descPct}" onclick="mudaDesconto(${d})">${d?d+'%':'Sem desconto'}</button>`).join('');
}
function mudaDesconto(d){ descPct = d; montaDescontos(); atualiza(); }
function descontoDoItem(c){ return c.desc ? c.qtd*c.preco*taxaDesconto() : 0; }

function contas(){
  let mensal=0, unico=0, dm=0, du=0, nMarcados=0;
  carrinho.forEach(c=>{
    const tot=c.qtd*c.preco, d=descontoDoItem(c);
    if(c.desc) nMarcados++;
    if(CATALOGO[c.i].tipo==='mensal'){ mensal+=tot; dm+=d; } else { unico+=tot; du+=d; }
  });
  return { mensal, unico, dm, du,
           mensalFinal:mensal-dm, unicoFinal:unico-du,
           taxa:taxaDesconto()*100, nMarcados };
}

function marcarTodos(v){ carrinho.forEach(c=>c.desc=v); atualiza(); }
function mudaFlag(i,v){ const c=carrinho.find(c=>c.i===i); c.desc=v; atualiza(); }

function atualiza(){
  const box = $('carrinho');
  $('qtdItens').textContent = carrinho.length ? carrinho.length+" no orçamento" : "";
  $('btnVer').disabled = !carrinho.length;

  if(!carrinho.length){
    box.innerHTML = `<p class="vazio">Escolha os produtos ao lado para montar o orçamento.</p>`;
    $('somas').innerHTML = `<div class="soma"><span>Total</span><span>${dinheiro(0)}</span></div>`;
    desenhaCatalogo(); return;
  }

  const taxa = taxaDesconto();
  box.innerHTML = carrinho.map(c=>{
    const p = CATALOGO[c.i], bruto = c.qtd*c.preco, d = descontoDoItem(c);
    return `<div class="linha ${d>0?'comdesc':''}">
      <div class="cab"><strong>${esc(nomeItem(p))}</strong><button class="tirar" onclick="tira(${c.i})">×</button></div>
      <div class="controles">
        <label>Qtd (${esc(p.unidade||'un')})<input class="qtd" type="number" min="1" step="1" value="${c.qtd}" oninput="mudaQtd(${c.i},this.value)"></label>
        <label>Valor unitário<input class="preco" type="number" min="0" step="0.01" value="${c.preco}" oninput="mudaPreco(${c.i},this.value)"></label>
        <div class="total">${d>0?`<s style="color:var(--tinta-suave);font-weight:400;font-size:12px">${dinheiro(bruto)}</s><br>`:''}${dinheiro(bruto-d)}${p.tipo==='mensal'?'<small>por mês</small>':'<small>uma vez</small>'}</div>
      </div>
      <label class="flag ${c.desc?'on':''}">
        <input type="checkbox" ${c.desc?'checked':''} onchange="mudaFlag(${c.i},this.checked)">
        ${c.desc?(taxa>0?`Desconto de ${(taxa*100).toFixed(1).replace('.',',')}% aplicado`:'Recebe o desconto'):'Sem desconto'}
      </label></div>`;
  }).join('');

  const t = contas();
  let h='';
  if(t.unico)  h+=`<div class="soma"><span>Valor único</span><span>${dinheiro(t.unico)}</span></div>`;
  if(t.dm+t.du) h+=`<div class="soma"><span>Desconto de ${t.taxa.toFixed(1).replace('.',',')}% em ${t.nMarcados} ${t.nMarcados===1?'item':'itens'}</span><span style="color:var(--ok)">− ${dinheiro(t.dm+t.du)}</span></div>`;
  if(t.unicoFinal)  h+=`<div class="soma forte"><span>Investimento inicial</span><span>${dinheiro(t.unicoFinal)}</span></div>`;
  if(t.mensalFinal) h+=`<div class="soma forte"><span>Por mês</span><span>${dinheiro(t.mensalFinal)}</span></div>`;
  if(t.mensalFinal) h+=`<div class="soma" style="margin-top:10px"><span>Valor total do contrato</span><span>${dinheiro(t.mensalFinal*12)}</span></div>`;
  $('somas').innerHTML = h;
  $('marcados').textContent = t.nMarcados ? `em ${t.nMarcados} de ${carrinho.length}` : 'nenhum item marcado';

  desenhaCatalogo();
}

function limparTudo(){
  carrinho=[]; idAtual=null; ['cliNome','cliContato','cliEmail','propObs'].forEach(id=>$(id).value='');
  descPct=0; montaDescontos(); padroes(); atualiza();
}

/* ---- documento ---- */
function tabela(titulo, tipo, sufixo){
  const linhas = carrinho.filter(c=>CATALOGO[c.i].tipo===tipo);
  if(!linhas.length) return '';
  return `<h3>${titulo}</h3><table class="itens">
    <thead><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Unitário</th><th class="n">Total</th></tr></thead>
    <tbody>${linhas.map(c=>{
      const p=CATALOGO[c.i], taxa=taxaDesconto(), temD=c.desc&&taxa>0;
      const unit = temD ? c.preco*(1-taxa) : c.preco;
      return `<tr>
        <td><div>${esc(nomeItem(p))}</div>${p.desc?`<div class="d">${esc(p.desc)}</div>`:''}${p.obs?`<div class="d">${esc(p.obs)}</div>`:''}</td>
        <td class="n">${c.qtd} ${esc(p.unidade||'un')}</td>
        <td class="n">${temD?`<s>${dinheiro(c.preco)}</s>`:''}${dinheiro(unit)}</td>
        <td class="n">${dinheiro(c.qtd*unit)}${sufixo}</td></tr>`;
    }).join('')}</tbody></table>`;
}

function montaDoc(){
  const t = contas();
  const hoje = new Date().toLocaleDateString('pt-BR');
  const val = $('propVal').value ? new Date($('propVal').value+'T12:00').toLocaleDateString('pt-BR') : '—';
  const obs = $('propObs').value.trim();

  $('doc').innerHTML = `
  <div class="doc-topo">
    <img src="${LOGO}" alt="${esc(EMPRESA.nome)}">
    <div class="meta">Proposta ${esc($('propNum').value||'—')}<br>Emitida em ${hoje}<br>Válida até ${val}</div>
  </div>

  <h1>Proposta comercial</h1>
  <p class="sub">${esc(nomePorte())} · plano ${ciclo==='anual'?'anual':'mensal'}</p>

  <div class="para">
    <div><span>Para</span>${esc($('cliNome').value||'—')}</div>
    <div><span>Contato</span>${esc($('cliContato').value||'—')}${$('cliEmail').value?' · '+esc($('cliEmail').value):''}</div>
    <div><span>Consultor</span>${esc($('propVend').value||'—')}</div>
    <div><span>Forma de pagamento</span>${esc($('propPgto').value)}</div>
  </div>

  ${tabela('Investimento inicial','unico','')}
  ${tabela(ciclo==='anual'?'Parcelado · plano anual em 12x':'Parcelado mensal','mensal',' <span class="d">/mês</span>')}

  <div class="fecho">
    ${t.dm+t.du?`<div class="l"><span>Subtotal</span><span>${dinheiro(t.mensal+t.unico)}</span></div>
    <div class="l"><span>Desconto de ${t.taxa.toFixed(1).replace('.',',')}%</span><span>− ${dinheiro(t.dm+t.du)}</span></div>`:''}
    ${t.unicoFinal?`<div class="l big"><span>Investimento inicial</span><span>${dinheiro(t.unicoFinal)}</span></div>`:''}
    ${t.mensalFinal?`<div class="l big"><span>${ciclo==='anual'?'12 parcelas de':'Mensalidade'}</span><span>${dinheiro(t.mensalFinal)}</span></div>`:''}
    ${t.mensalFinal?`<div class="l" style="margin-top:10px"><span>Valor total do contrato</span><span>${dinheiro(t.mensalFinal*12)}</span></div>`:''}
  </div>

  <h3>Condições</h3>
  <div class="obs">${esc(EMPRESA.condicoes)}${obs?'\n'+esc(obs):''}</div>

  <h3>Para seguir com a contratação</h3>
  <p class="obs" style="margin:0 0 12px">Assim que a proposta for aprovada, precisamos dos dados abaixo para gerar o contrato.</p>
  ${DADOS_NECESSARIOS.map(b=>`
    <div class="dados">
      <div class="dados-tit">${esc(b.titulo)}</div>
      <div class="dados-grade">${b.campos.map(c=>`<div class="dado"><span>${esc(c)}</span></div>`).join('')}</div>
    </div>`).join('')}

  <div class="rodape">
    <div>${esc(EMPRESA.nome)} · CNPJ ${esc(EMPRESA.cnpj)}</div>
    <div>${esc(EMPRESA.email)} · ${esc(EMPRESA.telefone)} · ${esc(EMPRESA.site)}</div>
  </div>`;
}

/* =====================================================================
   Armazenamento local — tudo fica no navegador de quem abre a página.
   Nada é enviado para servidor nenhum, então cada navegador enxerga
   apenas as propostas que ele mesmo salvou.
   ===================================================================== */
const CHAVE_PROP = 'avec:propostas:v1';
const CHAVE_LOG  = 'avec:log:v1';
let idAtual = null;

const STORAGE_OK = (()=>{ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }catch(e){ return false; } })();

function leJSON(chave, padrao){ try{ const v=localStorage.getItem(chave); return v?JSON.parse(v):padrao; }catch(e){ return padrao; } }
function gravaJSON(chave, valor){ try{ localStorage.setItem(chave, JSON.stringify(valor)); return true; }catch(e){ return false; } }

function registra(evento){
  if(!STORAGE_OK) return;
  const log = leJSON(CHAVE_LOG, []);
  log.unshift({ quando:new Date().toISOString(), evento });
  gravaJSON(CHAVE_LOG, log.slice(0,300));
}

function estadoAtual(){
  const t = contas();
  return {
    id: idAtual || ('p'+Date.now()),
    salvoEm: new Date().toISOString(),
    porte, ciclo, descPct, carrinho,
    resumo: { inicial:t.unicoFinal, mes:t.mensalFinal },
    cliente: {
      nome:$('cliNome').value, contato:$('cliContato').value, email:$('cliEmail').value,
      vend:$('propVend').value, num:$('propNum').value, dias:$('propDias').value,
      val:$('propVal').value, pgto:$('propPgto').value, obs:$('propObs').value
    }
  };
}

function aplicaEstado(e){
  porte   = e.porte || porte;
  ciclo   = e.ciclo || 'mensal';
  descPct = e.descPct || 0;
  carrinho = (e.carrinho||[]).slice();
  idAtual = e.id;
  $('porte').value = porte;
  ciclosUI(); montaPagamentos();
  const c = e.cliente || {};
  $('cliNome').value=c.nome||''; $('cliContato').value=c.contato||''; $('cliEmail').value=c.email||'';
  $('propVend').value=c.vend||''; $('propNum').value=c.num||''; $('propObs').value=c.obs||'';
  if(c.dias) $('propDias').value=c.dias;
  if(c.val)  $('propVal').value=c.val;
  if(c.pgto && [...$('propPgto').options].some(o=>o.value===c.pgto)) $('propPgto').value=c.pgto;
  desenhaAbas(); atualiza();
}

function salvarProposta(){
  if(!STORAGE_OK){ alert('Este navegador está com o armazenamento local bloqueado, então não dá para salvar aqui.'); return; }
  if(!carrinho.length){ alert('Monte o orçamento antes de salvar.'); return; }
  const e = estadoAtual(); idAtual = e.id;
  const lista = leJSON(CHAVE_PROP, []).filter(p=>p.id!==e.id);
  lista.unshift(e);
  if(!gravaJSON(CHAVE_PROP, lista)){ alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio.'); return; }
  registra('Salvou a proposta ' + (e.cliente.num || e.id) + (e.cliente.nome?(' · '+e.cliente.nome):''));
  desenhaSalvas();
}

function novaProposta(){ limparTudo(); registra('Começou uma proposta nova'); desenhaSalvas(); }

function abreProposta(id){
  const p = leJSON(CHAVE_PROP, []).find(x=>x.id===id);
  if(!p) return;
  aplicaEstado(p);
  registra('Abriu a proposta ' + (p.cliente.num || id));
  desenhaSalvas();
  window.scrollTo({top:0, behavior:'smooth'});
}

function excluiProposta(id, ev){
  ev.stopPropagation();
  const lista = leJSON(CHAVE_PROP, []);
  const p = lista.find(x=>x.id===id);
  if(!confirm('Excluir a proposta ' + ((p&&p.cliente.num)||id) + ' deste navegador?')) return;
  gravaJSON(CHAVE_PROP, lista.filter(x=>x.id!==id));
  if(idAtual===id) idAtual = null;
  registra('Excluiu a proposta ' + ((p&&p.cliente.num)||id));
  desenhaSalvas();
}

function desenhaSalvas(){
  const lista = leJSON(CHAVE_PROP, []);
  $('qtdSalvas').textContent = lista.length ? lista.length + (lista.length===1?' proposta':' propostas') : '';
  if(!STORAGE_OK){
    $('listaSalvas').innerHTML = '<p class="vazio">Este navegador bloqueia o armazenamento local, então as propostas não podem ser guardadas aqui.</p>';
    return;
  }
  if(!lista.length){
    $('listaSalvas').innerHTML = '<p class="vazio">Nada salvo ainda. Monte um orçamento e clique em salvar.</p>';
    return;
  }
  $('listaSalvas').innerHTML = lista.map(p=>{
    const d = new Date(p.salvoEm);
    const quando = d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const valores = [p.resumo && p.resumo.inicial ? dinheiro(p.resumo.inicial)+' inicial' : '',
                     p.resumo && p.resumo.mes ? dinheiro(p.resumo.mes)+' por mês' : ''].filter(Boolean).join(' · ');
    return `<div class="salva ${p.id===idAtual?'atual':''}" onclick="abreProposta('${p.id}')">
      <div class="txt">
        <div class="nome">${esc(p.cliente.nome||'Sem cliente')}</div>
        <div class="desc">${esc(p.cliente.num||'')} · ${esc(quando)}</div>
        <div class="desc">${valores}</div>
      </div>
      <button class="tirar" onclick="excluiProposta('${p.id}', event)" title="Excluir">×</button>
    </div>`;
  }).join('');
}

function abreLog(){
  const log = leJSON(CHAVE_LOG, []);
  $('logLista').innerHTML = log.length
    ? log.map(l=>{ const d=new Date(l.quando);
        return `<div class="linha-log"><span>${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>${esc(l.evento)}</div>`;
      }).join('')
    : '<p class="vazio">Nenhum registro ainda.</p>';
  document.body.classList.add('vendo-log');
}
function fechaLog(){ document.body.classList.remove('vendo-log'); }
function limpaLog(){ if(!confirm('Apagar o registro deste navegador?')) return; gravaJSON(CHAVE_LOG, []); abreLog(); }


function abrePreview(){ montaDoc(); document.body.classList.add('vendo'); window.scrollTo(0,0); }
function fechaPreview(){ document.body.classList.remove('vendo'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fechaPreview(); });

function mudaValidade(){
  const d=new Date(); d.setDate(d.getDate()+parseInt($('propDias').value,10));
  $('propVal').value = d.toISOString().slice(0,10);
}
function padroes(){
  const sel=$('propDias'), alvo=String(EMPRESA.validadeDias);
  if(![...sel.options].some(o=>o.value===alvo)) sel.add(new Option(alvo+" dias", alvo));
  sel.value = alvo;
  mudaValidade();
  const n=new Date();
  $('propNum').value = `${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}-${Math.floor(Math.random()*900+100)}`;
}

montaPortes(); montaPagamentos(); montaDescontos(); padroes(); desenhaAbas(); atualiza();
desenhaSalvas();
registra('Abriu a calculadora');
</script>
</body>
</html>
